server:
  port: 8080
  address: 127.0.0.1  # Escenario local con IntelliJ
  error:
    include-message: never
spring:
  application:
    name: novatech-commerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/novatech}
    username: ${DB_USER:novatech}
    password: ${DB_PASSWORD:novatech_dev}
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27018/novatech}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:CAMBIAR_esta_clave_DEMO_64_caracteres_minimo_12345678901234567890}
    hours: 8
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@novatech.local}
    password: ${ADMIN_PASSWORD:AdminDemo2026!}
  seed: ${SEED_DEMO:true}
  staff:
    sales-email: ${SALES_EMAIL:ventas@novatech.local}
    sales-password: ${SALES_PASSWORD:VentasDemo2026!}
    inventory-email: ${INVENTORY_EMAIL:almacen@novatech.local}
    inventory-password: ${INVENTORY_PASSWORD:AlmacenDemo2026!}
  internal-token: ${COMMERCE_INTERNAL_TOKEN:novatech-local-commerce-token-CHANGE-ME-2026}
  payment-timeout-minutes: 15

