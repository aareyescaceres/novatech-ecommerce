services:
  postgres:
    image: postgres:17-alpine
    container_name: novatech-postgres
    environment:
      POSTGRES_DB: novatech
      POSTGRES_USER: novatech
      POSTGRES_PASSWORD: novatech_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novatech -d novatech"]
      interval: 5s
      timeout: 3s
      retries: 10
  mongo:
    image: mongo:7
    container_name: novatech-mongo
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  mongo-data: